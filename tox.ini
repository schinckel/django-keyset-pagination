[tox]
envlist =
    py{310,311,312}-django42-sqlite
    py{310,311,312,313}-django52-sqlite
    py{312,313}-django60-sqlite
    py312-django{42,52,60}-postgres
    py312-django{42,52,60}-mysql
    lint
    pkg
skip_missing_interpreters = true

[testenv]
package = editable
deps =
    django42: Django>=4.2,<4.3
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    dj-database-url>=2.3
    mysql: mysqlclient>=2.2.1
    pytest>=8.3
    pytest-cov>=5
    pytest-django>=4.11
    postgres: psycopg[binary]>=3.2
    tomli>=2; python_version < "3.11"
setenv =
    DJANGO_SETTINGS_MODULE = tests.settings
    PYTHONPATH = {tox_root}{:}{tox_root}/src
    sqlite: DATABASE_URL = sqlite:///:memory:
    mysql: MYSQLCLIENT_CFLAGS = {env:MYSQLCLIENT_CFLAGS:-I/opt/homebrew/opt/mysql-client/include/mysql}
    mysql: MYSQLCLIENT_LDFLAGS = {env:MYSQLCLIENT_LDFLAGS:-L/opt/homebrew/opt/mysql-client/lib -lmysqlclient}
    mysql: DATABASE_URL = mysql://root:mysql@127.0.0.1:3306/{env_name}
    postgres: DATABASE_URL = postgresql://postgres:postgres@127.0.0.1:5432/{env_name}
commands =
    pytest --cov=keyset_pagination --cov-report=term-missing {posargs}

[testenv:lint]
skip_install = true
deps =
    ruff>=0.14,<0.15
commands =
    ruff check .
    ruff format --check .

[testenv:pkg]
skip_install = true
deps =
    build>=1.2
    twine>=6
commands =
    python -m build
    python -m twine check dist/*
