name: CI

on:
  push:
    branches:
      - main
      - modernize-tooling
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install tox
        run: python -m pip install --upgrade pip tox
      - name: Lint
        run: tox -e lint
      - name: Build package
        run: tox -e pkg

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            toxenv: py310-django42-sqlite
          - python-version: "3.11"
            toxenv: py311-django42-sqlite
          - python-version: "3.12"
            toxenv: py312-django42-sqlite
          - python-version: "3.10"
            toxenv: py310-django52-sqlite
          - python-version: "3.11"
            toxenv: py311-django52-sqlite
          - python-version: "3.12"
            toxenv: py312-django52-sqlite
          - python-version: "3.13"
            toxenv: py313-django52-sqlite
          - python-version: "3.12"
            toxenv: py312-django60-sqlite
          - python-version: "3.13"
            toxenv: py313-django60-sqlite
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install tox
        run: python -m pip install --upgrade pip tox
      - name: Run test matrix
        run: tox -e ${{ matrix.toxenv }}

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toxenv:
          - py312-django42-postgres
          - py312-django52-postgres
          - py312-django60-postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: django_keyset_pagination
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d django_keyset_pagination"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install tox
        run: python -m pip install --upgrade pip tox
      - name: Run PostgreSQL integration tests
        run: tox -e ${{ matrix.toxenv }}

  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toxenv:
          - py312-django42-mysql
          - py312-django52-mysql
          - py312-django60-mysql
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: django_keyset_pagination
          MYSQL_ROOT_HOST: "%"
          MYSQL_ROOT_PASSWORD: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install MySQL client development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - name: Export mysqlclient build flags
        run: |
          echo "MYSQLCLIENT_CFLAGS=$(pkg-config mysqlclient --cflags)" >> "$GITHUB_ENV"
          echo "MYSQLCLIENT_LDFLAGS=$(pkg-config mysqlclient --libs)" >> "$GITHUB_ENV"
      - name: Install tox
        run: python -m pip install --upgrade pip tox
      - name: Run MySQL integration tests
        run: tox -e ${{ matrix.toxenv }}
