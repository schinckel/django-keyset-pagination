[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "django-keyset-pagination-plus"
version = "0.10.0"
description = "Keyset pagination (seek method) for Django."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matthew Schinckel", email = "matt@schinckel.net" }]
keywords = ["django", "pagination", "keyset-pagination"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["Django>=4.2"]

[project.optional-dependencies]
test = [
    "dj-database-url>=2.3",
    "psycopg[binary]>=3.2",
    "pytest>=8.3",
    "pytest-cov>=5",
    "pytest-django>=4.11",
]
dev = [
    "build>=1.2",
    "pre-commit>=4",
    "ruff>=0.14,<0.16",
    "tox>=4.28",
    "twine>=6",
]

[project.urls]
Homepage = "https://github.com/schinckel/django-keyset-pagination"
Repository = "https://github.com/schinckel/django-keyset-pagination"
Issues = "https://github.com/schinckel/django-keyset-pagination/issues"
Changelog = "https://github.com/schinckel/django-keyset-pagination/blob/main/CHANGES.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
addopts = ["-ra"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests/tests"]

[tool.coverage.run]
branch = true
source = ["keyset_pagination"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
